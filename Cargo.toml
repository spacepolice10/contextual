[package]
name = "contextual"
version = "0.1.0"
edition = "2021"
description = "Minimal terminal text viewer"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
ignore = "0.4"
tree-sitter = "0.27.0"
tree-sitter-highlight = "0.27.0"
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }

[features]
default = ["all-langs"]
all-langs = ["lang-rust", "lang-python", "lang-javascript", "lang-typescript", "lang-html", "lang-ruby", "lang-elixir", "lang-php", "lang-c", "lang-toml", "lang-markdown"]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-html = ["dep:tree-sitter-html"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-elixir = ["dep:tree-sitter-elixir"]
lang-php = ["dep:tree-sitter-php"]
lang-c = ["dep:tree-sitter-c"]
lang-toml = ["dep:tree-sitter-toml-ng"]
# No markdown grammar dep: tree-sitter-markdown 0.7.1 ships no highlight queries
# AND links tree-sitter 0.19 C symbols that collide with the 0.27 runtime at link
# time (breaks every other language). Plain fallback until upstream ships queries
# on a modern runtime (follow-up).
lang-markdown = []
